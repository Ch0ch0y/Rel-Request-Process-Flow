version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env          # Create this file locally — never commit it
    environment:
      - DB_PATH=/app/data/rel_database.db
      # Required in .env: JWT_SECRET, CORS_ORIGINS
      # e.g.  JWT_SECRET=<long-random-string>  CORS_ORIGINS=http://your-frontend-host
      - ENVIRONMENT=production
    ports:
      - "8000:8000"
    volumes:
      - db_data:/app/data
      - ./backend/uploads:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/public/stats || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  db_data:
